services:
  - type: web
    name: leadscout-server
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: AI_GATEWAY_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: GCP_PROJECT_ID
        sync: false
      - key: GCP_SERVICE_ACCOUNT_KEY
        sync: false
